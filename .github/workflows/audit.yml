name: Briefstamp browser acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flowproof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test
      - name: Offline model provenance and budget safeguards
        run: python3 -m unittest discover -s eval -p 'test_*.py'
      - run: npm run build
      - name: Real isolated Mastra Agent with retained provider fixtures
        run: node --import tsx scripts/verify-mastra-agent-runtime.ts --run-offline
      - name: Real public demo within the free runtime memory limit
        run: node scripts/verify-public-runtime.mjs
      - name: Real healthy, broken and recovered website audits
        run: npm run audit:sample
      - name: Run approved project checks when provided
        run: |
          if [ -f briefstamp-plan.json ]; then
            npm run audit:plan -- briefstamp-plan.json
          elif [ -f flowproof-plan.json ]; then
            npm run audit:plan -- flowproof-plan.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flowproof-evidence
          path: |
            work/sample-audit/
            work/ci-audit/
            work/public-runtime/
          retention-days: 7
