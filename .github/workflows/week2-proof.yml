name: Briefstamp Week 2 bounded workflow proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/hosted-approval*.ts"
      - "server/approval-workflow.ts"
      - "server/hosted-temporal*.ts"
      - "temporal/hosted-*.ts"
      - "scripts/build-temporal-worker.ts"
      - "scripts/verify-approval-worker.ts"
      - "scripts/verify-hosted-temporal-local.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/week2-proof.yml"
permissions:
  contents: read
jobs:
  bounded-workflows:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Install official checksum-pinned Temporal development CLI
        shell: bash
        run: |
          set -euo pipefail
          cli_dir="$RUNNER_TEMP/briefstamp-temporal-cli"
          archive="$RUNNER_TEMP/briefstamp-temporal-cli.tar.gz"
          mkdir -p "$cli_dir"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 120 --retry 0 \
            'https://github.com/temporalio/cli/releases/download/v1.9.1/temporal_cli_1.9.1_linux_amd64.tar.gz' --output "$archive"
          printf '%s  %s\n' '09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$cli_dir" temporal
      - name: Compile native proof entrypoints
        run: |
          npx vite build --ssr scripts/verify-approval-http.ts --target node22 --outDir dist-approval-http
          npx vite build --ssr scripts/verify-hosted-temporal-local.ts --target node22 --outDir dist-temporal-verifier
      - name: Real HTTP approval, native snapshots and synthetic Chromium
        run: node --max-old-space-size=96 dist-approval-http/verify-approval-http.js --run-local --output work/week2-approval-ci
      - name: Real Temporal retry and worker-only recovery with retained provider fixtures
        run: |
          node --max-old-space-size=96 dist-temporal-verifier/verify-hosted-temporal-local.js \
            --cli "$RUNNER_TEMP/briefstamp-temporal-cli/temporal" --output work/week2-temporal-ci --full-app --chromium
      - name: Bind receipts to the exact source SHA
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { writeFile, mkdir } from 'node:fs/promises';
          await mkdir('work/week2-proof', { recursive: true });
          await writeFile('work/week2-proof/ci-manifest.json', JSON.stringify({
            sourceCommit: process.env.GITHUB_SHA,
            actionsRunUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            scope: 'Real CI SDK/server/browser mechanics; retained Gemma/Tiger/SerpApi fixtures. Zero fresh provider calls. Not Render hosted evidence.'
          }, null, 2) + '\n');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week2-bounded-workflow-evidence
          path: |
            work/week2-proof/*.json
            work/week2-approval-ci/**/*.json
            work/week2-temporal-ci/**/*.json
          retention-days: 3
          if-no-files-found: error
